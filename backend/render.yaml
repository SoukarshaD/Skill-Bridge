services:
  - type: web
    name: skill-bridge-api
    runtime: node
    plan: free

    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build:backend
    startCommand: npm run start -w backend

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: FRONTEND_URL
        sync: false