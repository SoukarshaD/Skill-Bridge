services:
  - type: web
    name: academia-industry-api
    runtime: node
    plan: free

    buildCommand: npm install && npx prisma generate && npm run build:backend

    preDeployCommand: npx prisma migrate deploy

    startCommand: npm run start -w backend

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: FRONTEND_URL
        sync: false